<head>

  <title>
    {% if title == "Home" %}
      {{ site.title }} | {{ site.description }}
    {% else %}
      {{ title }} | {{ site.title }}
    {% endif %}
  </title>

  <meta name="viewport" content="initial-scale=1" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <link rel="stylesheet" href="/assets/css/style.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Code+Pro" rel="stylesheet">

  <!-- <script type="text/javascript" src="/assets/js/script.js" async></script> -->

  <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/feed.xml" title="{{ site.title }}" />

  {% assign canonical_url = page.url | pretty_url | prepend: site.url %}
  <meta name="description" content="{{ site.description }}" />
  <link rel="canonical" href="{{ canonical_url }}" />
  <meta property="og:title" content="{{ title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta property="og:url" content="{{ canonical_url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  {% if tags contains "posts" %}
  <meta property="og:type" content="article" />
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  {% else %}
  <meta property="og:type" content="website" />
  {% endif %}
  <meta name="twitter:card" content="summary" />

</head>
